<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1710"/>
      <stop offset="1" stop-color="#050906"/>
    </linearGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a5ffad"/>
      <stop offset=".45" stop-color="#64e77c"/>
      <stop offset="1" stop-color="#39b95b"/>
    </linearGradient>
    <linearGradient id="front" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#35503d"/>
      <stop offset="1" stop-color="#17241b"/>
    </linearGradient>
    <linearGradient id="side" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2ebf5a"/>
      <stop offset="1" stop-color="#147a36"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="20" y="20" width="472" height="472" rx="118" fill="url(#bg)" stroke="#213328" stroke-width="10"/>
  <circle cx="160" cy="138" r="92" fill="#5dff82" opacity=".08"/>
  <circle cx="390" cy="370" r="110" fill="#7c5cff" opacity=".07"/>

  <g filter="url(#glow)">
    <polygon points="256,96 390,165 256,234 122,165" fill="url(#grass)"/>
    <polygon points="122,165 256,234 256,392 122,323" fill="url(#front)"/>
    <polygon points="256,234 390,165 390,323 256,392" fill="url(#side)"/>
  </g>

  <g opacity=".18" fill="#fff">
    <rect x="171" y="126" width="34" height="18" rx="3"/>
    <rect x="209" y="144" width="28" height="16" rx="3"/>
    <rect x="305" y="132" width="31" height="17" rx="3"/>
  </g>

  <!-- Pixel M on front face -->
  <g fill="#f3fff5">
    <rect x="153" y="226" width="26" height="91" rx="3"/>
    <rect x="217" y="258" width="26" height="91" rx="3"/>
    <rect x="179" y="239" width="19" height="26" rx="3"/>
    <rect x="198" y="252" width="19" height="26" rx="3"/>
  </g>

  <!-- small cyan server spark -->
  <g fill="#6df4ff">
    <rect x="359" y="106" width="14" height="42" rx="4"/>
    <rect x="345" y="120" width="42" height="14" rx="4"/>
  </g>
</svg>
